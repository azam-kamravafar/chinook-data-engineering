name: chinook-airflow

x-airflow-common: &airflow-common
  image: apache/airflow:3.4.0

  user: "${AIRFLOW_UID:-50000}:0"

  environment: &airflow-common-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@chinook-postgres:5432/${AIRFLOW_DB_NAME}"

    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

    AIRFLOW__CORE__AUTH_MANAGER: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/config/simple_auth_manager_passwords.json.generated"

    AIRFLOW__API__BASE_URL: "http://localhost:8080"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY}"

    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    AIRFLOW__API_AUTH__JWT_ISSUER: "chinook-airflow"

    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "30"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins

  networks:
    - chinook-net

services:

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: chinook-airflow-api-server
    command: ["api-server"]

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: chinook-airflow-scheduler
    command: ["scheduler"]

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: chinook-airflow-dag-processor
    command: ["dag-processor"]

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: chinook-airflow-triggerer
    command: ["triggerer"]

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

networks:
  chinook-net:
    external: true
    name: chinook-net
